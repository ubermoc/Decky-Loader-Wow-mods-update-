name: build

on:
  push:
    branches: [main, ccr-3267654b-kzmm1f, claude/dreamy-fermat-chozm7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Package plugin
        run: ./scripts/package.sh

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD=$(cat "out/WoW Addon Updater/BUILD")
          VERSION=$(cat VERSION)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "out/WoW Addon Updater.zip" \
            --prerelease \
            --title "Latest build" \
            --notes "Version ${VERSION} build ${BUILD}" \
            --target "$GITHUB_SHA"
